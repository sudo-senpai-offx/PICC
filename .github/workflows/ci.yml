name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: TypeScript check
        working-directory: apps/dashboard
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/dashboard
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Audit gate (fail on high/critical)
        working-directory: apps/dashboard
        run: npm audit --audit-level=high
      - name: Run tests
        working-directory: apps/dashboard
        run: npm test

  smoke-trading:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci
      # Phase 7 exit criterion — repeatable end-to-end smoke: boots the real
      # server and fails loudly if the decision engine never emits.
      - name: Trading E2E smoke probe
        working-directory: apps/dashboard
        run: npm run smoke:trading
