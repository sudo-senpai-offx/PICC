name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The repo is an npm-workspace root: the single lockfile lives at the repo
# root (package-lock.json), and apps/dashboard is a workspace. Older versions
# of this file ran `npm ci` inside apps/dashboard with a
# cache-dependency-path pointing at a lockfile that does not exist — that job
# could never install. All installs/audits now run at the root; typecheck,
# build, test and smoke resolve to the @picc/dashboard workspace.

jobs:
  lint-and-typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build

  test:
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit gate (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test

  smoke-trading:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Phase 7 exit criterion — repeatable end-to-end smoke: boots the real
      # server and fails loudly if the decision engine never emits.
      - name: Trading E2E smoke probe
        run: npm run smoke:trading --workspace @picc/dashboard
