name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The repo is an npm-workspace root: the single lockfile lives at the repo
# root (package-lock.json), and apps/dashboard is a workspace. Older versions
# of this file ran `npm ci` inside apps/dashboard with a
# cache-dependency-path pointing at a lockfile that does not exist — that job
# could never install. All installs/audits now run at the root; typecheck,
# build, test and smoke resolve to the @picc/dashboard workspace.

jobs:
  # Secrets gate — runs FIRST and independently so a leaked credential never
  # reaches the build matrix. Gitleaks scans the whole tree (and the full diff
  # on PRs) against .gitleaks.toml, which pins the known leaked EO tokens.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ""
        with:
          fetch-depth: 0

  lint-and-typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build

  test:
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      # fetch-depth: 0 is REQUIRED, not a preference. ws5SeamGuard pins a frozen
      # baseline commit (`const BASELINE = "d400c70"`, the WS-4 spec resolution) and
      # reads it with `git show`/`git diff`. actions/checkout@v4 defaults to
      # fetch-depth: 1, so on a shallow clone every baseline read returns null, the
      # guard's deliberate fail-closed path fires ("an unreadable/absent baseline
      # for a SURVING path"), and 6 of its 17 tests fail on a runner whose checkout
      # is at fault. secrets-scan already sets fetch-depth: 0 for the same reason.
      # Weakening the guard instead would invert a security check that is designed
      # to fail closed: a gate that cannot fail is not a gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit gate (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test

  # WS-7 T13 / D15 model supply-chain gate.
  #
  # SPEC WHITELIST POSITION: `.github/workflows/**` is NOT in the file-touch
  # union at spec :73, which requires "a dated spec amendment" for a path
  # outside it. T13:1312 nevertheless names "CI config" in its file list, so the
  # two texts disagree. Resolution taken: the job lands, and the amendment is
  # recorded as an open item in
  # docs/trading-logic/changelog/entries/0025-T13_MODEL_LAYER_SUPPLY_CHAIN_ROUTING-v1-to-v2.md
  # rather than the edit being made silently. It is called out here as well so a
  # reviewer reading this file does not have to find the changelog first.
  #
  # This job is DELIBERATELY NOT `continue-on-error`. A gate that cannot fail a
  # build is not a gate, and D15:223 says the rule is "enforced as a CI gate".
  # `--fetch` obtains the pinned artifact and verifies the download against the
  # manifest's SHA-256 BEFORE the verification pass, so a corrupt download
  # deletes itself and fails here rather than being accepted and re-verified
  # later. Without `--fetch` the same job fails on an absent artifact, which is
  # the required behaviour for a developer running it locally.
  model-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model digest + format gate (D15 / AC-032)
        run: node scripts/model-digest-gate.mjs --fetch

  smoke-trading:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Phase 7 exit criterion — repeatable end-to-end smoke: boots the real
      # server and fails loudly if the decision engine never emits.
      - name: Trading E2E smoke probe
        run: npm run smoke:trading --workspace @picc/dashboard
