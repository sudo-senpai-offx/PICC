research_task:
  description: "Conduct thorough research on {topic}. Focus on key concepts, recent developments, major challenges, notable applications, and future outlook."
  expected_output: "A comprehensive research document with organized sections, specific facts, figures, and useful examples about {topic}."
  agent: "researcher"

analysis_task:
  description: "Analyze the research findings and create a professional report on {topic}. Include an executive summary, key insights, trend analysis, risk assessment, and actionable recommendations."
  expected_output: "A professional markdown report with clear headings, a concise summary, main findings, risks, and recommendations."
  agent: "analyst"
  context:
    - "research_task"

content_task:
  description: "Based on the research and analysis, create engaging {platform}-optimized content about {topic}. Use {format} conventions and include a clear call to action."
  expected_output: "Platform-optimized content with a strong headline, structured body, relevant SEO tags, and a clear call to action."
  agent: "content_creator"
  context:
    - "research_task"
    - "analysis_task"
