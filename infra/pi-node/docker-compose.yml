version: "3.9"

# PICC Pi Node — runs several Tier 0 bandwidth-sharing providers as containers
# so one small device (Raspberry Pi 4/5, ARM or x86) earns across platforms.
#
# Copy .env.example to .env and fill in credentials, then: docker compose up -d
#
# Desktop-only providers (PacketStream, Grass, Nodepay, Gradient) and providers
# that prohibit containers (EarnApp — ToS bans Docker/VMs/home servers) have no
# container here and are intentionally not listed — see README.md.

services:
  honeygain:
    image: honeygain/honeygain:latest
    container_name: honeygain
    restart: unless-stopped
    env_file: .env
    environment:
      - HONEYGAIN_EMAIL=${HONEYGAIN_EMAIL}
      - HONEYGAIN_PASSWORD=${HONEYGAIN_PASSWORD}
      - HONEYGAIN_DEVICE_NAME=${HONEYGAIN_DEVICE_NAME:-picc-pi}
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  pawns:
    image: iproyal/pawns-cli:latest
    container_name: pawns
    restart: unless-stopped
    env_file: .env
    command: --accept-tos --email=${PAWNS_EMAIL} --password=${PAWNS_PASSWORD} --device-name=${PAWNS_DEVICE_NAME:-picc-pi}
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  traffmonetizer:
    image: traffmonetizer/cli_v2:latest
    container_name: traffmonetizer
    restart: unless-stopped
    env_file: .env
    command: start accept --token ${TM_TOKEN}
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  repocket:
    image: repocket/repocket:latest
    container_name: repocket
    restart: unless-stopped
    env_file: .env
    environment:
      - RP_EMAIL=${RP_EMAIL}
      - RP_API_KEY=${RP_API_KEY}
    logging:
      options:
        max-size: "5m"
        max-file: "3"

